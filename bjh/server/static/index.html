<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><title>百家号流水线</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="panel()" x-init="init()">
  <nav class="flex gap-1 p-4 border-b border-gray-800">
    <template x-for="t in ['stats','topics','videos','posts','settings']">
      <button @click="tab=t" x-text="({stats:'统计',topics:'热榜',videos:'视频',posts:'队列',settings:'设置'})[t]"
              :class="tab===t ? 'bg-blue-600' : 'bg-gray-800'"
              class="px-4 py-2 rounded"></button>
    </template>
    <span class="ml-auto text-sm text-gray-400 self-center" x-text="hint"></span>
  </nav>

  <main class="p-4 max-w-5xl mx-auto">
    <div class="flex flex-wrap gap-2 mb-4 bg-gray-900 rounded p-3">
      <button @click="doFetch()" :disabled="!!job.running"
              class="bg-green-700 disabled:opacity-40 px-3 py-2 rounded text-sm">📥 抓热文</button>
      <button @click="doCreate()" :disabled="!!job.running"
              class="bg-indigo-700 disabled:opacity-40 px-3 py-2 rounded text-sm">🎬 生成视频</button>
      <button @click="doPublish()" :disabled="!!job.running"
              class="bg-red-700 disabled:opacity-40 px-3 py-2 rounded text-sm">🚀 立即发布</button>
      <button @click="doRun()" :disabled="!!job.running"
              class="bg-blue-800 disabled:opacity-40 px-3 py-2 rounded text-sm">⚡ 一键全流程</button>
      <span class="text-sm self-center" :class="job.running ? 'text-yellow-400' : (lastOk() ? 'text-green-400' : 'text-gray-400')"
            x-text="jobLine()"></span>
    </div>

    <section x-show="tab==='stats'" class="grid grid-cols-3 gap-4">
      <div class="bg-gray-900 rounded p-6 text-center"><div class="text-4xl" x-text="s.today_published"></div>今日已发</div>
      <div class="bg-gray-900 rounded p-6 text-center"><div class="text-4xl" x-text="s.total_videos"></div>累计视频</div>
      <div class="bg-gray-900 rounded p-6 text-center"><div class="text-4xl" x-text="(s.total_cost||0).toFixed(3)"></div>累计成本(元)</div>
    </section>

    <section x-show="tab==='topics'">
      <input x-model="kw" @keyup.enter="refresh()" placeholder="关键词过滤" class="bg-gray-900 rounded px-3 py-2 mb-3">
      <table class="w-full text-sm"><tbody>
        <template x-for="t in topics"><tr class="border-b border-gray-800">
          <td class="py-1" x-text="t.title"></td>
          <td x-text="'R'+t.reads"></td><td x-text="'C'+t.comments"></td>
          <td x-text="t.heat_score.toFixed(1)"></td><td x-text="t.status"></td>
          <td>
            <button x-show="t.blocked_draft_id" @click="unblock(t)" class="bg-amber-700 px-2 py-1 rounded text-sm mr-1">解除拦截</button>
            <button @click="delTopic(t)" class="bg-red-900 px-2 py-1 rounded text-sm">删除</button>
          </td>
        </tr></template>
      </tbody></table>
    </section>

    <section x-show="tab==='videos'">
      <template x-for="v in videos"><div class="bg-gray-900 rounded p-3 mb-2 flex items-center gap-3">
        <video class="w-24 rounded" :src="'/api/videos/'+v.id+'/file'" controls muted></video>
        <div class="flex-1">
          <div x-text="v.draft_title"></div>
          <div class="text-xs text-gray-400" x-text="v.duration_sec.toFixed(0)+'s · ¥'+v.cost.toFixed(3)+' · '+v.status"></div>
        </div>
        <button @click="retitle(v.draft_id)" class="bg-gray-700 px-2 py-1 rounded text-sm">改标题</button>
        <button @click="queue(v.id)" class="bg-blue-600 px-2 py-1 rounded text-sm">入队</button>
        <button @click="del(v)" class="bg-red-900 px-2 py-1 rounded text-sm">删除</button>
      </div></template>
    </section>

    <section x-show="tab==='posts'">
      <table class="w-full text-sm"><tbody>
        <template x-for="p in posts"><tr class="border-b border-gray-800">
          <td x-text="'#'+p.id"></td><td x-text="p.status"></td>
          <td x-text="p.scheduled_at"></td><td x-text="p.bjh_url||p.error||''"></td>
          <td>
            <button x-show="p.status==='failed'" @click="retryPost(p)" class="bg-amber-700 px-2 py-1 rounded text-sm mr-1">重发</button>
            <a x-show="p.screenshot_path" :href="'/api/screenshots/'+encodeURIComponent(p.screenshot_path.split('/').pop())" target="_blank" class="underline">截图</a>
          </td>
        </tr></template>
      </tbody></table>
    </section>

    <section x-show="tab==='settings'">
      <div class="flex items-center gap-2 mb-3">
        日上限 <input type="number" x-model.number="c.daily_limit" @change="saveCfg()" class="bg-gray-900 rounded px-2 py-1 w-20">
        间隔下限(分) <input type="number" x-model.number="c.interval_min_min" @change="saveCfg()" class="bg-gray-900 rounded px-2 py-1 w-20">
        间隔上限(分) <input type="number" x-model.number="c.interval_max_min" @change="saveCfg()" class="bg-gray-900 rounded px-2 py-1 w-20">
      </div>
      <div class="flex items-center gap-2 mb-3">
        配音音色
        <select x-model="c.tts_voice" @change="saveCfg()" class="bg-gray-900 rounded px-2 py-1">
          <option value="zh-CN-XiaoxiaoNeural">晓晓 · 标准女声（默认）</option>
          <option value="zh-CN-XiaoyiNeural">晓伊 · 年轻女声 · 活泼</option>
          <option value="zh-CN-YunxiNeural">云希 · 年轻男声 · 自然口语</option>
          <option value="zh-CN-YunjianNeural">云健 · 浑厚男声 · 故事感</option>
          <option value="zh-CN-YunyangNeural">云扬 · 标准男声 · 新闻播报</option>
          <option value="zh-CN-liaoning-XiaobeiNeural">晓贝 · 东北女声 · 接地气</option>
          <option value="zh-CN-shaanxi-XiaoniNeural">晓妮 · 陕西女声</option>
        </select>
        <span class="text-gray-500 text-sm">切换后对新视频生效</span>
      </div>
      <template x-for="a in accounts"><div class="bg-gray-900 rounded p-3 mb-2 flex justify-between">
        <span x-text="a.name + (a.status==='expired' ? ' ⚠Cookie失效，请 bjh login' : '')"></span>
        <span x-text="'日上限 '+a.daily_limit"></span>
      </div></template>
    </section>
  </main>

<script>
function panel(){return{tab:'stats',kw:'',hint:'',topics:[],videos:[],posts:[],accounts:[],s:{},c:{},job:{running:null,last:null},
  async init(){await this.refresh();setInterval(()=>this.refresh(),5000)},
  async refresh(){
    const g=async u=>(await fetch(u)).json();
    this.s=await g('/api/stats');
    this.topics=await g('/api/topics'+(this.kw?('?keyword='+encodeURIComponent(this.kw)):''));
    this.videos=await g('/api/videos');
    this.posts=await g('/api/posts');
    this.accounts=await g('/api/accounts');
    this.c=await g('/api/config');
    this.job=await g('/api/job');
    this.hint='今日 '+this.s.today_published+' · 自动刷新中';
  },
  async post(u,body){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
    if(!r.ok){alert((await r.json()).detail||r.statusText);return false}
    this.refresh();return true},
  async doFetch(){const kw=prompt('搜索关键词（如：养生）');if(!kw)return;
    await this.post('/api/fetch',{keyword:kw,pages:1})},
  async doCreate(){const n=prompt('生成几条？','1');if(!n)return;
    await this.post('/api/create',{count:parseInt(n)||1})},
  async doPublish(){if(!confirm('立即发布最旧一条未发视频？（会弹出浏览器，含AI内容将如实申报）'))return;
    await this.post('/api/publish')},
  async doRun(){const kw=prompt('关键词（抓→做→发一条，其余排队）');if(!kw)return;
    const n=prompt('产量几条？','1');if(!n)return;
    await this.post('/api/run',{keyword:kw,count:parseInt(n)||1,pages:1})},
  jobLine(){if(this.job.running)return '⏳ '+this.job.running+' 进行中…（页面会自动刷新结果）';
    const l=this.job.last;if(!l)return '';
    return (l.ok?'✅ ':'❌ ')+l.name+'：'+l.result},
  lastOk(){return this.job.last&&this.job.last.ok},
  async retitle(id){const t=prompt('新标题');if(!t)return;
    await fetch('/api/drafts/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t})});this.refresh()},
  async queue(id){await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_id:id})});this.refresh()},
  async del(v){if(!confirm('删除视频「'+v.draft_title+'」？文件与排队记录一并删除，不可恢复'))return;
    const r=await fetch('/api/videos/'+v.id,{method:'DELETE'});
    if(!r.ok){alert((await r.json()).detail||r.statusText);return}
    this.refresh()},
  async saveCfg(){await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.c)})},
  async delTopic(t){if(!confirm('删除热榜「'+t.title+'」？被拦截的文案一并删除'))return;
    const r=await fetch('/api/topics/'+t.id,{method:'DELETE'});
    if(!r.ok){alert((await r.json()).detail||r.statusText);return}
    this.refresh()},
  async unblock(t){if(!confirm('解除「'+t.title+'」的文案拦截并重建视频？'))return;
    const r=await fetch('/api/drafts/'+t.blocked_draft_id+'/unblock',{method:'POST'});
    if(!r.ok){alert((await r.json()).detail||r.statusText);return}
    this.refresh()},
  async retryPost(p){if(!confirm('重新发布这条失败的视频？'))return;
    const r=await fetch('/api/posts/'+p.id+'/retry',{method:'POST'});
    if(!r.ok){alert((await r.json()).detail||r.statusText);return}
    this.refresh()}
}}
</script>
</body></html>
