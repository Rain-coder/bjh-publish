[project]
name = "bjh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "playwright>=1.45",
  "httpx>=0.27",
  "edge-tts>=6.1",
  "pillow>=10.0",
  "beautifulsoup4>=4.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
bjh = "bjh.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
